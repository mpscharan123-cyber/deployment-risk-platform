name: Deploy Risk Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  risk_assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Code Changes
        id: compute_changes
        run: |
          git diff --shortstat ${{ github.event.pull_request.base.sha }} ${{ github.sha }} > diff_stat.txt || echo "0 files changed, 0 insertions(+), 0 deletions(-)" > diff_stat.txt
          FILES_CHANGED=$(cat diff_stat.txt | grep -o '[0-9]* file' | awk '{print $1}' || echo 0)
          LINES_ADDED=$(cat diff_stat.txt | grep -o '[0-9]* insertion' | awk '{print $1}' || echo 0)
          LINES_DELETED=$(cat diff_stat.txt | grep -o '[0-9]* deletion' | awk '{print $1}' || echo 0)
          echo "files_changed=${FILES_CHANGED:-0}" >> $GITHUB_OUTPUT
          echo "lines_added=${LINES_ADDED:-0}" >> $GITHUB_OUTPUT
          echo "lines_deleted=${LINES_DELETED:-0}" >> $GITHUB_OUTPUT

      - name: Send payload to Risk Platform API
        run: |
          # Normally this uses a secret for the production API endpoint with authentication
          # For demonstration, we use a placeholder or public webhook URL
          curl -X POST https://api.your-risk-platform.com/api/deployments \
          -H "Content-Type: application/json" \
          -d '{
            "commit_hash": "${{ github.sha }}",
            "author": "${{ github.actor }}",
            "code_changes": {
              "lines_added": ${{ steps.compute_changes.outputs.lines_added }},
              "lines_deleted": ${{ steps.compute_changes.outputs.lines_deleted }},
              "files_changed": ${{ steps.compute_changes.outputs.files_changed }}
            }
          }'
